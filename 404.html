<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Eric Barriga Medina</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">

  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("js");
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") root.dataset.theme = saved;
      } catch (e) { /* almacenamiento no disponible */ }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- Rutas absolutas: esta página se sirve para cualquier URL inexistente -->
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <main class="hero not-found">
    <div class="container hero__content">
      <p class="section__eyebrow">Error 404</p>
      <h1 class="hero__title">Esta página no existe</h1>
      <p class="hero__lead">
        Puede que el enlace esté mal escrito o que la página se haya movido.
        Todo el portfolio está en la página principal.
      </p>
      <a class="btn btn--primary" href="/">Volver al portfolio</a>
    </div>
  </main>
</body>
</html>
