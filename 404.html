<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Eric Barriga Medina</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/PortfolioEricBarrigaMedina/assets/img/favicon.svg" type="image/svg+xml">

  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("js");
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "light" || saved === "dark") root.dataset.theme = saved;
      } catch (e) { /* almacenamiento no disponible */ }
    })();
  </script>

  <link rel="preload" href="/PortfolioEricBarrigaMedina/assets/fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Rutas absolutas (incluyen el nombre del repositorio): esta página
       se sirve para cualquier URL inexistente, esté en la carpeta que esté -->
  <link rel="stylesheet" href="/PortfolioEricBarrigaMedina/css/fonts.css">
  <link rel="stylesheet" href="/PortfolioEricBarrigaMedina/css/tokens.css">
  <link rel="stylesheet" href="/PortfolioEricBarrigaMedina/css/base.css">
  <link rel="stylesheet" href="/PortfolioEricBarrigaMedina/css/layout.css">
  <link rel="stylesheet" href="/PortfolioEricBarrigaMedina/css/components.css">
</head>
<body>
  <main class="hero not-found">
    <div class="container hero__content">
      <p class="section__eyebrow">Error 404</p>
      <h1 class="hero__title">Esta página no existe</h1>
      <p class="hero__lead">
        Puede que el enlace esté mal escrito o que la página se haya movido.
        Todo el portfolio está en la página principal.
      </p>
      <a class="btn btn--primary" href="/PortfolioEricBarrigaMedina/">Volver al portfolio</a>
    </div>
  </main>
</body>
</html>
