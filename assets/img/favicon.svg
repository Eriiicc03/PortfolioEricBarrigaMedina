<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon: un chip visto desde arriba (se adapta al modo oscuro del navegador) -->
  <style>
    .cuerpo { fill: #141414; }
    .texto { fill: #f3f0e8; }
    .pines { fill: #8a8a8a; }
    @media (prefers-color-scheme: dark) {
      .cuerpo { fill: #f3f0e8; }
      .texto { fill: #141414; }
    }
  </style>
  <g class="pines">
    <rect x="4" y="17" width="10" height="4"/><rect x="4" y="25" width="10" height="4"/><rect x="4" y="33" width="10" height="4"/><rect x="4" y="41" width="10" height="4"/>
    <rect x="50" y="17" width="10" height="4"/><rect x="50" y="25" width="10" height="4"/><rect x="50" y="33" width="10" height="4"/><rect x="50" y="41" width="10" height="4"/>
    <rect x="17" y="4" width="4" height="10"/><rect x="25" y="4" width="4" height="10"/><rect x="33" y="4" width="4" height="10"/><rect x="41" y="4" width="4" height="10"/>
    <rect x="17" y="50" width="4" height="10"/><rect x="25" y="50" width="4" height="10"/><rect x="33" y="50" width="4" height="10"/><rect x="41" y="50" width="4" height="10"/>
  </g>
  <rect class="cuerpo" x="13" y="13" width="38" height="38" rx="3"/>
  <circle cx="20" cy="20" r="2.5" fill="#c8102e"/>
  <text class="texto" x="32" y="38.5" text-anchor="middle" font-family="IBM Plex Sans Condensed, Arial Narrow, Arial, sans-serif" font-size="16" font-weight="700">EB</text>
</svg>
